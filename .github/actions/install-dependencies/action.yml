name: Install dependencies
description: Install the optional C++ dependencies (FFTW, Eigen, autodiff) for the "full" feature set
inputs:
  features:
    description: "full or minimal"
    required: true
runs:
  using: composite
  steps:
    - name: System packages
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build
        if [ "${{ inputs.features }}" = "full" ]; then
          sudo apt-get install -y libfftw3-dev libeigen3-dev
        fi
    - name: autodiff
      if: inputs.features == 'full'
      shell: bash
      run: |
        git clone --depth 1 --branch v1.1.2 https://github.com/autodiff/autodiff.git "$RUNNER_TEMP/autodiff"
        cmake -S "$RUNNER_TEMP/autodiff" -B "$RUNNER_TEMP/autodiff/build" -DAUTODIFF_BUILD_TESTS=OFF -DAUTODIFF_BUILD_PYTHON=OFF -DAUTODIFF_BUILD_EXAMPLES=OFF -DAUTODIFF_BUILD_DOCS=OFF
        sudo cmake --install "$RUNNER_TEMP/autodiff/build"
