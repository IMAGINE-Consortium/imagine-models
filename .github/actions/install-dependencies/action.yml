name: Install dependencies
description: Install the optional C++ dependencies (FFTW, Eigen, autodiff) for the "full" feature set
inputs:
  features:
    description: "full or minimal"
    required: true
  eigen:
    description: "Eigen major version for the full feature set: 3 (system package) or 5 (5.0.1 from source)"
    required: false
    default: "3"
runs:
  using: composite
  steps:
    - name: System packages (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build
        if [ "${{ inputs.features }}" = "full" ]; then
          sudo apt-get install -y libfftw3-dev
          if [ "${{ inputs.eigen }}" = "3" ]; then
            sudo apt-get install -y libeigen3-dev
          fi
        fi
    - name: System packages (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install ninja
        if [ "${{ inputs.features }}" = "full" ]; then
          brew install fftw eigen@3
          echo "CMAKE_PREFIX_PATH=$(brew --prefix eigen@3):$(brew --prefix)" >> "$GITHUB_ENV"
        else
          echo "CMAKE_PREFIX_PATH=$(brew --prefix)" >> "$GITHUB_ENV"
        fi
    - name: Eigen 5 (from source)
      if: inputs.features == 'full' && inputs.eigen == '5'
      shell: bash
      run: |
        for attempt in 1 2 3; do
          git clone --depth 1 --branch 5.0.1 https://gitlab.com/libeigen/eigen.git "$RUNNER_TEMP/eigen-src" && break
          rm -rf "$RUNNER_TEMP/eigen-src"
          sleep 30
        done
        if [ ! -d "$RUNNER_TEMP/eigen-src" ]; then
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/eigen.tar.gz" https://gitlab.com/libeigen/eigen/-/archive/5.0.1/eigen-5.0.1.tar.gz
          mkdir -p "$RUNNER_TEMP/eigen-src"
          tar xzf "$RUNNER_TEMP/eigen.tar.gz" -C "$RUNNER_TEMP/eigen-src" --strip-components=1
        fi
        cmake -S "$RUNNER_TEMP/eigen-src" -B "$RUNNER_TEMP/eigen-build" -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/eigen5" -DBUILD_TESTING=OFF -DEIGEN_BUILD_DOC=OFF -DEIGEN_BUILD_BLAS=OFF -DEIGEN_BUILD_LAPACK=OFF
        cmake --install "$RUNNER_TEMP/eigen-build"
        echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/eigen5${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"
    - name: autodiff
      if: inputs.features == 'full'
      shell: bash
      run: |
        git clone --depth 1 --branch v1.1.2 https://github.com/autodiff/autodiff.git "$RUNNER_TEMP/autodiff"
        cmake -S "$RUNNER_TEMP/autodiff" -B "$RUNNER_TEMP/autodiff-build" -DAUTODIFF_BUILD_TESTS=OFF -DAUTODIFF_BUILD_PYTHON=OFF -DAUTODIFF_BUILD_EXAMPLES=OFF -DAUTODIFF_BUILD_DOCS=OFF
        sudo cmake --install "$RUNNER_TEMP/autodiff-build"
