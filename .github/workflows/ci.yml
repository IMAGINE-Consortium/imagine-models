name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: python -m pip install clang-format==23.1.3 ruff==0.16.10
      - name: clang-format
        run: git ls-files '*.h' '*.cc' | xargs clang-format --dry-run --Werror
      - name: ruff
        run: |
          ruff format --check
          ruff check

  cpp:
    name: C++ ${{ matrix.os }} (${{ matrix.features }}, ${{ matrix.build_type }}${{ matrix.eigen == '5' && ', Eigen 5' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        features: [full, minimal]
        build_type: [Debug]
        include:
          - {os: ubuntu-24.04, features: full, build_type: Release}
          - {os: ubuntu-24.04, features: full, build_type: Debug, eigen: "5"}
    env:
      FEATURE_FLAGS: ${{ matrix.features == 'minimal' && '-DUSE_AUTODIFF=OFF -DUSE_FFTW=OFF' || '' }}
      EXPECTED: ${{ matrix.features == 'full' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/install-dependencies
        with:
          features: ${{ matrix.features }}
          eigen: ${{ matrix.eigen || '3' }}
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} $FEATURE_FLAGS
      - name: Check detected features
        run: |
          cat build/c_library/generated/ImagineModels/config.h
          grep -q "IMAGINE_HAS_AUTODIFF $EXPECTED" build/c_library/generated/ImagineModels/config.h
          grep -q "IMAGINE_HAS_FFTW $EXPECTED" build/c_library/generated/ImagineModels/config.h
          if [ "${{ matrix.eigen }}" = "5" ]; then grep "^Eigen3_DIR:PATH=.*eigen5" build/CMakeCache.txt; fi
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install and build external consumer
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/prefix"
          cmake -S c_library/test/consumer -B "$RUNNER_TEMP/consumer" -G Ninja -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/prefix"
          cmake --build "$RUNNER_TEMP/consumer"
          LD_LIBRARY_PATH="$RUNNER_TEMP/prefix/lib" DYLD_LIBRARY_PATH="$RUNNER_TEMP/prefix/lib" "$RUNNER_TEMP/consumer/consumer"

  python:
    name: Python ${{ matrix.python }} ${{ matrix.os }} (${{ matrix.features }}${{ matrix.eigen == '5' && ', Eigen 5' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: "3.9", features: full}
          - {os: ubuntu-24.04, python: "3.12", features: full}
          - {os: ubuntu-24.04, python: "3.13", features: full}
          - {os: ubuntu-24.04, python: "3.12", features: minimal}
          - {os: macos-15, python: "3.12", features: full}
          - {os: macos-15, python: "3.12", features: minimal}
          - {os: ubuntu-24.04, python: "3.12", features: full, eigen: "5"}
    env:
      USE_AUTODIFF: ${{ matrix.features == 'full' && 'ON' || 'OFF' }}
      USE_FFTW: ${{ matrix.features == 'full' && 'ON' || 'OFF' }}
      EXPECTED: ${{ matrix.features == 'full' && 'True' || 'False' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: ./.github/actions/install-dependencies
        with:
          features: ${{ matrix.features }}
          eigen: ${{ matrix.eigen || '3' }}
      - name: Install
        run: python -m pip install ".[test]"
      - name: Check detected features
        working-directory: ${{ runner.temp }}
        run: python -c "import ImagineModels as im; print(im.__version__, im.has_autodiff, im.has_fftw); assert im.has_autodiff == $EXPECTED and im.has_fftw == $EXPECTED"
      - name: Test
        run: pytest

  package:
    name: sdist -> wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/install-dependencies
        with:
          features: full
      - name: Build sdist
        run: |
          python -m pip install build
          python -m build --sdist --outdir dist
      - name: Install from sdist into a clean environment and test
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.tar.gz pytest
          "$RUNNER_TEMP/venv/bin/pytest"
